name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t housing-model:ci .

      - name: Run container
        run: |
          docker run -d --rm --name housing-ci -p 8000:8000 \
            -e LOG_FORMAT=pretty \
            housing-model:ci
          sleep 2

      - name: Smoke test /health
        run: curl -f http://localhost:8000/health

      - name: Smoke test /predict
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "records": [{
                "longitude": -122.23,
                "latitude": 37.88,
                "housing_median_age": 41,
                "total_rooms": 880,
                "total_bedrooms": 129,
                "population": 322,
                "households": 126,
                "median_income": 8.3252,
                "ocean_proximity": "NEAR BAY"
              }]
            }'

      - name: Show container logs (debug)
        if: failure()
        run: docker logs housing-ci || true

      - name: Stop container
        if: always()
        run: docker stop housing-ci || true
